[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nucoffice"
version = "0.1.0.dev0"
description = "Installiert, aktualisiert und startet die NC-Tools für die Nuklearchemie"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "platformdirs>=4",
    "psutil>=5.9",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
nucoffice = "nucoffice.cli:main"

[project.gui-scripts]
nucoffice-gui = "nucoffice.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nucoffice = ["tools.toml", "gui/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
